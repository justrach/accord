<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Extra bytes per 64-byte payload</title>
  <desc id="d">Accord +4, len32 +5, grpc-stream +15, json +16, grpc-unary +33, HTTP/1.1 +50</desc>
  <rect width="720" height="360" rx="12" fill="#f8fafc"/>
  <text x="28" y="36" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="650" fill="#0f172a">Extra bytes on the wire · 64 B payload</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">localhost Unix bakeoff · framing only · seq not on the wire</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <text x="28" y="100" fill="#334155">accord</text>
    <rect x="140" y="82" width="42" height="26" rx="4" fill="#0f766e"/>
    <text x="190" y="100" fill="#0f766e" font-weight="650">+4</text>
    <text x="28" y="140" fill="#334155">len32</text>
    <rect x="140" y="122" width="52" height="26" rx="4" fill="#64748b"/>
    <text x="200" y="140" fill="#475569" font-weight="650">+5</text>
    <text x="28" y="180" fill="#334155">grpc-stream</text>
    <rect x="140" y="162" width="156" height="26" rx="4" fill="#6366f1"/>
    <text x="304" y="180" fill="#4338ca" font-weight="650">+15</text>
    <text x="28" y="220" fill="#334155">json</text>
    <rect x="140" y="202" width="166" height="26" rx="4" fill="#db2777"/>
    <text x="314" y="220" fill="#9d174d" font-weight="650">+16</text>
    <text x="28" y="260" fill="#334155">grpc-unary</text>
    <rect x="140" y="242" width="343" height="26" rx="4" fill="#7c3aed"/>
    <text x="491" y="260" fill="#5b21b6" font-weight="650">+33</text>
    <text x="28" y="300" fill="#334155">http/1.1</text>
    <rect x="140" y="282" width="520" height="26" rx="4" fill="#d97706"/>
    <text x="668" y="300" fill="#b45309" font-weight="650">+50</text>
  </g>
  <text x="140" y="338" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">0                                            50 B / msg</text>
