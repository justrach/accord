<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Pipeline throughput 20k × 64 B</title>
  <desc id="d">accord 14.57M, grpc-stream 14.24M, len32 13.70M, grpc-unary 10.76M, json 9.64M, http/1.1 7.15M msgs/s</desc>
  <rect width="720" height="360" rx="12" fill="#f8fafc"/>
  <text x="28" y="36" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="650" fill="#0f172a">Pipeline · 20 000 msgs × 64 B · interleaved median</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">ReleaseFast · Unix socket · DATA-path only (no HPACK / WINDOW_UPDATE)</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <text x="28" y="100" fill="#334155">accord</text>
    <rect x="140" y="82" width="520" height="26" rx="4" fill="#0f766e"/>
    <text x="668" y="100" fill="#0f766e" font-weight="650">14.6M</text>
    <text x="28" y="140" fill="#334155">grpc-stream</text>
    <rect x="140" y="122" width="508" height="26" rx="4" fill="#6366f1"/>
    <text x="656" y="140" fill="#4338ca" font-weight="650">14.2M</text>
    <text x="28" y="180" fill="#334155">len32</text>
    <rect x="140" y="162" width="489" height="26" rx="4" fill="#64748b"/>
    <text x="637" y="180" fill="#475569" font-weight="650">13.7M</text>
    <text x="28" y="220" fill="#334155">grpc-unary</text>
    <rect x="140" y="202" width="384" height="26" rx="4" fill="#7c3aed"/>
    <text x="532" y="220" fill="#5b21b6" font-weight="650">10.8M</text>
    <text x="28" y="260" fill="#334155">json</text>
    <rect x="140" y="242" width="344" height="26" rx="4" fill="#db2777"/>
    <text x="492" y="260" fill="#9d174d" font-weight="650">9.64M</text>
    <text x="28" y="300" fill="#334155">http/1.1</text>
    <rect x="140" y="282" width="255" height="26" rx="4" fill="#d97706"/>
    <text x="403" y="300" fill="#b45309" font-weight="650">7.15M</text>
  </g>
  <text x="140" y="338" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">msgs/s  ·  1 KiB payloads cluster (~1.5M) — memcpy, not headers</text>
</svg>
