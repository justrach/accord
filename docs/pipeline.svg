<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Pipeline throughput 20k × 64 B</title>
  <desc id="d">grpc-stream 9.80M, len32 8.46M, grpc-unary 7.50M, accord 7.24M, json 5.52M, http/1.1 4.40M msgs/s</desc>
  <rect width="720" height="360" rx="12" fill="#f8fafc"/>
  <text x="28" y="36" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="650" fill="#0f172a">Pipeline · 20 000 msgs × 64 B · one Unix socket</text>
  <text x="28" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">ReleaseFast · same process · syscall-bound; WAN/TLS not measured</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <text x="28" y="100" fill="#334155">grpc-stream</text>
    <rect x="140" y="82" width="520" height="26" rx="4" fill="#6366f1"/>
    <text x="668" y="100" fill="#4338ca" font-weight="650">9.80M</text>
    <text x="28" y="140" fill="#334155">len32</text>
    <rect x="140" y="122" width="449" height="26" rx="4" fill="#64748b"/>
    <text x="597" y="140" fill="#475569" font-weight="650">8.46M</text>
    <text x="28" y="180" fill="#334155">grpc-unary</text>
    <rect x="140" y="162" width="398" height="26" rx="4" fill="#7c3aed"/>
    <text x="546" y="180" fill="#5b21b6" font-weight="650">7.50M</text>
    <text x="28" y="220" fill="#334155">accord</text>
    <rect x="140" y="202" width="384" height="26" rx="4" fill="#0f766e"/>
    <text x="532" y="220" fill="#0f766e" font-weight="650">7.24M</text>
    <text x="28" y="260" fill="#334155">json</text>
    <rect x="140" y="242" width="293" height="26" rx="4" fill="#db2777"/>
    <text x="441" y="260" fill="#9d174d" font-weight="650">5.52M</text>
    <text x="28" y="300" fill="#334155">http/1.1</text>
    <rect x="140" y="282" width="234" height="26" rx="4" fill="#d97706"/>
    <text x="382" y="300" fill="#b45309" font-weight="650">4.40M</text>
  </g>
  <text x="140" y="338" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">msgs/s  (binary framings cluster; memcpy + write, not RPC semantics)</text>
</svg>
